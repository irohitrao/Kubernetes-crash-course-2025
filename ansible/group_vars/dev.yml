---
# Development Environment Configuration
env_name: dev
aws_region: us-east-1
aws_account_id: "{{ dev_aws_account_id | default('123456789012') }}"
ecr_repository_url: "{{ aws_account_id }}.dkr.ecr.{{ aws_region }}.amazonaws.com"

# Kubernetes Configuration
k8s_namespace: crash-course
k8s_context: dev-eks

# Application Configuration
app_domain: app-dev.example.com
cert_email: admin-dev@example.com

# Image Configuration
frontend_image_tag: "{{ frontend_image_tag | default('latest') }}"
auth_image_tag: "{{ auth_image_tag | default('latest') }}"
game_image_tag: "{{ game_image_tag | default('latest') }}"

frontend_image: "{{ ecr_repository_url }}/frontend:{{ frontend_image_tag }}"
auth_image: "{{ ecr_repository_url }}/auth:{{ auth_image_tag }}"
game_image: "{{ ecr_repository_url }}/game:{{ game_image_tag }}"

# Database Configuration
db_secret_name: postgres-app
db_username: postgres
db_password: "{{ dev_db_password | default('dev-password') }}"

# Feature Flags
enable_monitoring: false
enable_tls: true
enable_http_redirect: true

# Timeouts
workload_ready_timeout: 300
database_ready_timeout: 120
gateway_ready_timeout: 180
