# manifests/cluster-issuer.yaml
# ClusterIssuer defines how cert-manager should issue and renew TLS certificates.
# This uses Let's Encrypt's ACME protocol with HTTP-01 challenges.
#
# Key workflow:
# 1. Gateway references this ClusterIssuer via annotation
# 2. cert-manager detects the TLS Secret is missing
# 3. Creates a Certificate resource pointing to this ClusterIssuer
# 4. Starts HTTP-01 challenge by creating temporary HTTPRoute (cm-acme-http-solver-*)
# 5. Let's Encrypt validates domain by accessing /.well-known/acme-challenge/
# 6. Upon success, creates the TLS Secret (k8s2025.rohitmrdevops.online-tls)
# 7. Gateway's HTTPS listener uses this Secret for TLS termination

apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-prod
spec:
  # ACME (Automated Certificate Management Environment) configuration
  acme:
    # Let's Encrypt production server (use for real certs; staging available for testing)
    server: https://acme-v02.api.letsencrypt.org/directory
    # Email for Let's Encrypt notifications (cert expiry warnings, etc.)
    email: hirohit28@gmail.com
    # Secret to store the ACME account private key (auto-created by cert-manager)
    privateKeySecretRef:
      name: letsencrypt-prod
    
    solvers:
      # HTTP-01 Challenge Solver
      # This tells cert-manager HOW to prove domain ownership to Let's Encrypt.
      # HTTP-01 works by serving a challenge token at: http://domain/.well-known/acme-challenge/{token}
      - http01:
          gatewayHTTPRoute: {}

