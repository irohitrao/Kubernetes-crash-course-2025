apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: frontend-redirect
  namespace: crash-course
spec:
  parentRefs:
  - name: crash-course-gateway
    namespace: kgateway-system
    sectionName: cm-acme
  hostnames:
  - k8s2025.rohitmrdevops.online
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /              # broad match — ACME paths (more specific) win over this
    filters:
    - type: RequestRedirect
      requestRedirect:
        scheme: https
        statusCode: 301
